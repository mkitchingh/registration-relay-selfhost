name: registration-relay

services:
  relay:
    # Prebuilt multi-arch image of the relay. If it can't be pulled,
    # Compose builds it from this repo instead (deploy/Dockerfile).
    image: ghcr.io/mkitchingh/registration-relay-selfhost:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: rr-relay
    restart: unless-stopped
    environment:
      - REGISTRATION_RELAY_SECRET=${REGISTRATION_RELAY_SECRET:?Set REGISTRATION_RELAY_SECRET in .env (openssl rand -base64 32)}

  filter:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: rr-filter
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relay
    # Reachable only from this machine. Used by Tailscale Funnel or your own
    # reverse proxy; Cloudflare Tunnel reaches it over the Docker network.
    ports:
      - "127.0.0.1:${RELAY_LOCAL_PORT:-8080}:8080"

  # Started only when COMPOSE_PROFILES includes "cloudflare" (see .env).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rr-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - filter
