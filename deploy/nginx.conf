# Routing filter in front of the relay.
#
# The relay forwards every /api/v1/bridge/<command> to the connected device.
# Registration providers implement get-version-info and get-validation-data.
# Any other command is ignored by the device, so the relay waits 60 s, blocks
# that device's other requests meanwhile, then drops the device's connection.
#
# Some clients send other commands periodically. Beeper's hosted relay answers
# them with an instant, empty 401 and the clients carry on. This filter does
# the same; everything else passes through untouched.

pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Look the relay up through Docker's DNS on every request (cached 10 s)
    # rather than once at startup, so recreating the relay container (updates,
    # Watchtower) doesn't leave nginx pointing at its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        set $relay http://relay:8000;

        # All request headers are set here, once. In nginx, any proxy_set_header
        # inside a location replaces every one inherited from this level, so
        # none may appear in the locations below.
        proxy_http_version 1.1;
        # Pass Host exactly as received: the relay's websocket check compares
        # it to the client's Origin, and $host would drop a port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Websocket upgrade; for ordinary requests this sends "Connection: close",
        # which is nginx's default anyway.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The two commands relay apps implement: pass through. The relay waits
        # up to 60 s for the device, so allow a little longer here.
        location ~ ^/api/v1/bridge/(get-version-info|get-validation-data)$ {
            proxy_pass $relay;
            proxy_read_timeout 90s;
        }

        # Any other bridge command: instant empty 401, as Beeper's hosted relay does.
        # (error_page keeps the 401 status but swaps nginx's HTML error page
        # for an empty body, matching Beeper's 0-byte response.)
        location /api/v1/bridge/ {
            error_page 401 /__empty;
            return 401;
        }
        location = /__empty {
            internal;
            return 200 "";
        }

        # The device's long-lived websocket. This block is generated at
        # container start by deploy/provider-path.sh from PROVIDER_SECRET:
        # open at /api/v1/provider by default, or moved behind a secret path
        # (with the bare path closed) when PROVIDER_SECRET is set.
        include /etc/nginx/conf.d/provider.conf;

        # Everything else (/health, unknown paths) goes to the relay as-is.
        location / {
            proxy_pass $relay;
        }
    }
}
