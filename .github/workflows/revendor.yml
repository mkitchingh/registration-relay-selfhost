name: Revendor (temporary)
on:
  push:
    branches: [upstream-sync]
    paths: ['.github/workflows/revendor.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate vendor/ and build against it
        run: |
          go mod vendor
          go build -mod=vendor ./...
      - name: Commit vendor/
        run: |
          git config user.name "Matthew Kitchin"
          git config user.email "25916510+mkitchingh@users.noreply.github.com"
          git add -A vendor
          git commit -m "Update vendored dependencies to match go.mod" || echo "vendor already up to date"
          git push
      - name: Test-build the deploy image (not pushed)
        run: docker build -f deploy/Dockerfile .
