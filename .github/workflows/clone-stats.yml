name: Clone stats

# Records weekly clone traffic into stats/clones.csv and redraws
# stats/clones.svg, so the history is kept past GitHub's 14-day window.
# Needs a token that can read repo traffic (GITHUB_TOKEN can't): add a
# fine-grained PAT for this repo with "Administration: Read" as the secret
# TRAFFIC_TOKEN (Settings -> Secrets and variables -> Actions).
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch clone traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TRAFFIC_TOKEN secret is not set (needs a PAT with Administration: Read)."
            exit 1
          fi
          gh api "repos/${{ github.repository }}/traffic/clones" > clones.json

      - name: Update CSV and chart
        run: python3 stats/update_clone_stats.py clones.json

      - name: Commit if changed
        run: |
          rm -f clones.json
          if git diff --quiet -- stats/; then
            echo "No change in clone stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/clones.csv stats/clones.svg
          git commit -m "chore: update clone stats"
          git push
