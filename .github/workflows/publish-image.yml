name: Publish image

# Builds the relay from this repo (deploy/Dockerfile) for Intel and ARM and
# publishes it to GitHub Container Registry.
on:
  push:
    branches: [main]
    # Only rebuild when something that goes into the image changes. Docs and
    # runtime config (nginx.conf, compose, provider-path.sh, .env.example) are
    # mounted at runtime, not baked in, so they don't trigger a rebuild.
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
